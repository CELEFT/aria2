name: Build aria2 for Android (arm64-v8a, API 35)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full xz-utils dpkg-dev \
            autoconf automake libtool pkg-config gettext file

      - name: Download Android NDK r30-beta2
        run: |
          wget -q https://googledownloads.cn/android/repository/android-ndk-r30-beta2-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "NDK_ROOT=$HOME/android-ndk-r30" >> $GITHUB_ENV
          # 列出 bin 目录，方便调试
          ls -l $HOME/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -30

      - name: Download and extract dependency libraries
        run: |
          mkdir -p $HOME/deps

          wget -q https://github.com/CELEFT/C/releases/download/trash/zlib-lib.7z -O /tmp/zlib.7z
          7z x /tmp/zlib.7z -o/tmp/zlib_extract
          mkdir -p $HOME/deps/zlib && cp -r /tmp/zlib_extract/* $HOME/deps/zlib/

          wget -q https://github.com/CELEFT/C/releases/download/android-openssl-latest/openssl-android-arm64-v8a-api35-3.5.7.tar.gz -O /tmp/openssl.tar.gz
          mkdir -p $HOME/deps/openssl && tar -xzf /tmp/openssl.tar.gz --strip-components=1 -C $HOME/deps/openssl

          wget -q https://github.com/CELEFT/C/releases/download/libexpat%2Blibcares/libexpat-android-35-arm64-v8a-20260813.tar.xz -O /tmp/expat.tar.xz
          mkdir -p $HOME/deps/expat && tar -xJf /tmp/expat.tar.xz --strip-components=1 -C $HOME/deps/expat

          wget -q https://github.com/CELEFT/C/releases/download/libexpat%2Blibcares/libcares-android-35-arm64-v8a-20260813.tar.xz -O /tmp/cares.tar.xz
          mkdir -p $HOME/deps/cares && tar -xJf /tmp/cares.tar.xz --strip-components=1 -C $HOME/deps/cares

          wget -q https://github.com/CELEFT/C/releases/download/trash/libssh2.7z -O /tmp/libssh2.7z
          7z x /tmp/libssh2.7z -o/tmp/libssh2_extract
          mkdir -p $HOME/deps/libssh2 && cp -r /tmp/libssh2_extract/* $HOME/deps/libssh2/

          # 修正 .pc 文件的 prefix
          for lib in zlib openssl expat cares libssh2; do
            if [ -d "$HOME/deps/$lib" ]; then
              find "$HOME/deps/$lib" -name "*.pc" -exec sed -i "s|^prefix=.*|prefix=$HOME/deps/$lib|g" {} \;
            fi
          done

      - name: Set up environment variables (auto-detect compiler)
        run: |
          NDK_ROOT=$HOME/android-ndk-r30
          TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          SYSROOT=$TOOLCHAIN/sysroot

          # 自动探测可用的 clang
          # 优先使用带有 API 35 的，若没有则尝试 30，再没有则使用不带 API 的 clang + --target
          if [ -f "$TOOLCHAIN/bin/aarch64-linux-android35-clang" ]; then
            CC="$TOOLCHAIN/bin/aarch64-linux-android35-clang"
            CXX="$TOOLCHAIN/bin/aarch64-linux-android35-clang++"
          elif [ -f "$TOOLCHAIN/bin/aarch64-linux-android30-clang" ]; then
            CC="$TOOLCHAIN/bin/aarch64-linux-android30-clang"
            CXX="$TOOLCHAIN/bin/aarch64-linux-android30-clang++"
          elif [ -f "$TOOLCHAIN/bin/clang" ]; then
            # 使用通用 clang + --target
            CC="$TOOLCHAIN/bin/clang --target=aarch64-linux-android35"
            CXX="$TOOLCHAIN/bin/clang++ --target=aarch64-linux-android35"
          else
            echo "No suitable clang found! Listing bin directory:"
            ls -l $TOOLCHAIN/bin/
            exit 1
          fi

          # 其他工具
          AR="$TOOLCHAIN/bin/llvm-ar"
          AS="$TOOLCHAIN/bin/llvm-as"
          LD="$TOOLCHAIN/bin/ld.lld"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          STRIP="$TOOLCHAIN/bin/llvm-strip"

          # PKG_CONFIG_LIBDIR
          PKG_CONFIG_LIBDIR=$(find $HOME/deps -name "*.pc" -printf "%h\n" | grep -v PaxHeader | sort -u | tr '\n' ':' | sed 's/:$//')

          # 导出环境变量
          echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "AS=$AS" >> $GITHUB_ENV
          echo "LD=$LD" >> $GITHUB_ENV
          echo "RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "STRIP=$STRIP" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR" >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_ENV

      - name: Generate auxiliary files (if configure missing)
        run: |
          touch config.rpath ABOUT-NLS
          AUTOPOINT=true autoreconf -fi
          chmod +x configure

      - name: Test compiler functionality
        run: |
          echo 'int main() { return 0; }' > test.c
          $CC --sysroot=$SYSROOT -pie test.c -o test || {
            echo "=== Compilation test failed, verbose output ==="
            $CC --sysroot=$SYSROOT -v -pie test.c -o test 2>&1
            exit 1
          }
          file test
          rm test test.c

      - name: Configure aria2
        run: |
          ./configure \
            --host=aarch64-linux-android \
            --build=x86_64-pc-linux-gnu \
            --disable-nls \
            --without-gnutls \
            --with-openssl \
            --without-sqlite3 \
            --without-libxml2 \
            --with-libexpat \
            --with-libcares \
            --with-libz \
            --with-libssh2 \
            --disable-static \
            --enable-shared \
            AR="$AR" \
            AS="$AS" \
            CC="$CC" \
            CXX="$CXX" \
            LD="$LD" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            CXXFLAGS="-Os -g --sysroot=$SYSROOT" \
            CFLAGS="-Os -g --sysroot=$SYSROOT" \
            CPPFLAGS="-fPIE" \
            LDFLAGS="--sysroot=$SYSROOT -pie -Wl,-rpath='\$ORIGIN/lib:./lib'" \
            PKG_CONFIG_LIBDIR="$PKG_CONFIG_LIBDIR" || {
              echo "=== configure failed, dumping config.log ==="
              cat config.log
              exit 1
            }

      - name: Build aria2
        run: make -j$(nproc)

      - name: Prepare artifacts
        run: |
          mkdir -p output/bin output/lib
          cp src/aria2c output/bin/
          find $HOME/deps -name "*.so" -exec cp {} output/lib/ \;
          # 复制 C++ 运行时，路径可能因 API 不同而异，这里尝试找 libc++_shared.so
          CXX_RUNTIME=$(find $SYSROOT/usr/lib/aarch64-linux-android -name "libc++_shared.so" | head -1)
          if [ -f "$CXX_RUNTIME" ]; then
            cp "$CXX_RUNTIME" output/lib/
          else
            echo "Warning: libc++_shared.so not found, may cause runtime issues."
          fi
          $STRIP output/bin/aria2c
          find output/lib -name "*.so" -exec $STRIP {} \; 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-android-arm64-v8a
          path: output/
