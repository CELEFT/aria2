name: Build aria2 for Android (arm64-v8a, API 35)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

env:
  NDK_VERSION: r30-beta2
  ANDROID_API: 35
  LINK_CXX_STATIC: "true"
  DEPS_URL: https://github.com/CELEFT/C/releases/download
  OPENSSL_VER: 3.5.7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full xz-utils dpkg-dev \
            autoconf automake libtool pkg-config gettext autopoint file

      - name: Download Android NDK (arm64-v8a / android-35)
        run: |
          wget -q "https://googledownloads.cn/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip -d $HOME
          NDK_ROOT=$(ls -d $HOME/android-ndk-* | head -1)
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "NDK extracted to: $NDK_ROOT"
          ls -l $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -30

      - name: Download and extract prebuilt dependency libraries
        run: |
          set -e
          mkdir -p $HOME/deps

          wget -q "$DEPS_URL/trash/zlib-lib.7z" -O /tmp/zlib.7z
          7z x /tmp/zlib.7z -o/tmp/zlib_extract -y
          mkdir -p $HOME/deps/zlib && cp -r /tmp/zlib_extract/* $HOME/deps/zlib/

          wget -q "$DEPS_URL/android-openssl-latest/openssl-android-arm64-v8a-api35-${OPENSSL_VER}.tar.gz" -O /tmp/openssl.tar.gz
          mkdir -p $HOME/deps/openssl && tar -xzf /tmp/openssl.tar.gz --strip-components=1 -C $HOME/deps/openssl

          wget -q "$DEPS_URL/libexpat%2Blibcares/libexpat-android-35-arm64-v8a-20260813.tar.xz" -O /tmp/expat.tar.xz
          mkdir -p $HOME/deps/expat && tar -xJf /tmp/expat.tar.xz --strip-components=1 -C $HOME/deps/expat

          wget -q "$DEPS_URL/libexpat%2Blibcares/libcares-android-35-arm64-v8a-20260813.tar.xz" -O /tmp/cares.tar.xz
          mkdir -p $HOME/deps/cares && tar -xJf /tmp/cares.tar.xz --strip-components=1 -C $HOME/deps/cares

          wget -q "$DEPS_URL/trash/libssh2.7z" -O /tmp/libssh2.7z
          7z x /tmp/libssh2.7z -o/tmp/libssh2_extract -y
          mkdir -p $HOME/deps/libssh2 && cp -r /tmp/libssh2_extract/* $HOME/deps/libssh2/

          find $HOME/deps -name "PaxHeader" -exec rm -rf {} + 2>/dev/null || true

          echo "================ 解压完成 ================"
          for lib in zlib openssl expat cares libssh2; do
            echo "---- $HOME/deps/$lib ----"
            find "$HOME/deps/$lib" -maxdepth 3 -type d | sort | head -50
          done

      - name: Repair .so symlinks broken by 7z extraction
        run: |
          set -e
          for so in $(find $HOME/deps -type f \( -name "*.so" -o -name "*.so.*" \)); do
            if file "$so" 2>/dev/null | grep -q "ASCII text"; then
              target=$(cat "$so" | tr -d '\r\n ')
              if [ -n "$target" ] && echo "$target" | grep -qE '^[^()[:space:]]+$'; then
                if [ "${target:0:1}" = "/" ]; then real="$target"; else real="$(dirname "$so")/$target"; fi
                if [ -e "$real" ]; then
                  rm -f "$so"
                  ln -s "$target" "$so"
                  echo "repaired: $so -> $target"
                else
                  echo "WARNING: $so references missing target '$target', skipped"
                fi
              fi
            fi
          done

      - name: Verify OpenSSL version in libcrypto.so + header
        run: |
          set -e
          SO_FILE=$(find $HOME/deps/openssl -name "libcrypto.so*" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: no libcrypto.so found under $HOME/deps/openssl"
            exit 1
          fi
          echo "Checking $SO_FILE"
          if strings "$SO_FILE" | grep -q "OpenSSL ${OPENSSL_VER} "; then
            echo "OK: libcrypto.so reports OpenSSL ${OPENSSL_VER}"
          else
            echo "ERROR: libcrypto.so does NOT report OpenSSL ${OPENSSL_VER}"
            strings "$SO_FILE" | grep -E 'OpenSSL [0-9]' || true
            exit 1
          fi
          HEADER="$HOME/deps/openssl/include/openssl/opensslv.h"
          if [ -f "$HEADER" ]; then
            HEADER_VER=$(grep -oP 'OPENSSL_VERSION_TEXT "\K[^"]+' "$HEADER" 2>/dev/null || echo "UNPARSED")
            echo "Checking $HEADER -> $HEADER_VER"
            if echo "$HEADER_VER" | grep -q "OpenSSL ${OPENSSL_VER}"; then
              echo "OK: opensslv.h reports OpenSSL ${OPENSSL_VER}"
            else
              echo "ERROR: opensslv.h reports '$HEADER_VER', expected '${OPENSSL_VER}'"
              exit 1
            fi
          fi

      - name: Match .pc files / generate missing ones
        run: |
          set -e
          shallowest() {
            while read -r p; do
              [ -n "$p" ] && echo "$(printf '%s' "$p" | tr -cd '/' | wc -c) $p"
            done | sort -n | head -1 | cut -d' ' -f2-
          }
          for lib in zlib openssl expat cares libssh2; do
            base="$HOME/deps/$lib"
            [ -d "$base" ] || continue
            prefix=$(find "$base" -type d -name include -printf "%h\n" 2>/dev/null | shallowest)
            [ -n "$prefix" ] || prefix="$base"
            libdir=$(find "$prefix" -maxdepth 2 -type d \( -name lib -o -name lib64 \) -printf "%p\n" 2>/dev/null | shallowest)
            [ -n "$libdir" ] || libdir="$prefix/lib"
            incdir="$prefix/include"
            echo "==> [$lib] prefix=$prefix  libdir=$libdir  includedir=$incdir"
            find "$base" -name "*.pc" ! -path "*/PaxHeader/*" -exec sed -i \
              -e "s|^prefix=.*|prefix=$prefix|" \
              -e "s|^libdir=.*|libdir=${libdir}|" \
              -e "s|^includedir=.*|includedir=${incdir}|" \
              {} \;
            if [ "$lib" = "openssl" ]; then
              mkdir -p "$libdir/pkgconfig"
              gen_pc() {
                local name="$1" desc="$2" libs="$3"
                {
                  echo "prefix=$prefix"
                  echo "libdir=$libdir"
                  echo "includedir=$incdir"
                  echo ""
                  echo "Name: $name"
                  echo "Description: $desc"
                  echo "Version: $OPENSSL_VER"
                  echo "Libs: $libs"
                  echo "Libs.private: -ldl -pthread"
                  echo "Cflags: -I$incdir"
                } > "$libdir/pkgconfig/$name.pc"
              }
              gen_pc openssl "Secure Sockets Layer and cryptography libraries" "-L$libdir -lssl -lcrypto"
              gen_pc libcrypto "OpenSSL cryptography library" "-L$libdir -lcrypto"
              gen_pc libssl "OpenSSL Secure Sockets Layer library" "-L$libdir -lssl"
              echo "Generated openssl.pc / libcrypto.pc / libssl.pc"
            fi
            libupper=$(echo "$lib" | tr 'a-z' 'A-Z')
            echo "${libupper}_INC=$incdir" >> $GITHUB_ENV
            echo "${libupper}_LIB=$libdir" >> $GITHUB_ENV
          done
          echo "================ 修正后的 .pc 文件 ================"
          for f in $(find $HOME/deps -name "*.pc" ! -path "*/PaxHeader/*"); do
            echo "--- $f ---"
            grep -E "^(prefix|libdir|includedir)=" "$f" || true
          done

      - name: Set up environment variables (auto-detect compiler)
        run: |
          TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          SYSROOT=$TOOLCHAIN/sysroot
          echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV
          if [ -f "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" ]; then
            CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
            CXX="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
          elif [ -f "$TOOLCHAIN/bin/aarch64-linux-android30-clang" ]; then
            CC="$TOOLCHAIN/bin/aarch64-linux-android30-clang"
            CXX="$TOOLCHAIN/bin/aarch64-linux-android30-clang++"
          elif [ -f "$TOOLCHAIN/bin/clang" ]; then
            CC="$TOOLCHAIN/bin/clang --target=aarch64-linux-android${ANDROID_API}"
            CXX="$TOOLCHAIN/bin/clang++ --target=aarch64-linux-android${ANDROID_API}"
          else
            echo "No suitable clang found!"; ls -l $TOOLCHAIN/bin/; exit 1
          fi
          echo "CC=$CC"          >> $GITHUB_ENV
          echo "CXX=$CXX"        >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar"      >> $GITHUB_ENV
          echo "AS=$TOOLCHAIN/bin/llvm-as"      >> $GITHUB_ENV
          echo "LD=$TOOLCHAIN/bin/ld.lld"       >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip"   >> $GITHUB_ENV
          PKG_CONFIG_LIBDIR=$(find $HOME/deps -name "*.pc" ! -path "*/PaxHeader/*" -printf "%h\n" | sort -u | tr '\n' ':' | sed 's/:$//')
          echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH

      - name: Generate auxiliary files (if configure missing)
        run: |
          set -e
          touch config.rpath ABOUT-NLS
          if [ ! -f po/Makefile.in.in ]; then
            SRC=$(find /usr/share/gettext -name "Makefile.in.in" 2>/dev/null | head -1)
            if [ -n "$SRC" ]; then cp "$SRC" po/Makefile.in.in && echo "pre-copied from $SRC"; fi
          fi
          autoreconf -fi || echo "WARNING: autoreconf non-zero"
          if [ ! -f po/Makefile.in.in ]; then
            echo "=== ERROR: po/Makefile.in.in missing ==="; ls -la po/ 2>/dev/null; exit 1
          fi
          chmod +x configure

      - name: Test compiler functionality
        run: |
          echo 'int main() { return 0; }' > test_compile.c
          $CC --sysroot=$SYSROOT -pie test_compile.c -o compile_test || {
            echo "=== Compilation test failed ==="
            $CC --sysroot=$SYSROOT -v -pie test_compile.c -o compile_test 2>&1; exit 1
          }
          file compile_test; rm compile_test test_compile.c

      - name: Configure aria2
        run: |
          set -e
          DEPS_CFLAGS="-I$ZLIB_INC -I$OPENSSL_INC -I$EXPAT_INC -I$CARES_INC -I$LIBSSH2_INC"
          DEPS_LDFLAGS="-L$ZLIB_LIB -L$OPENSSL_LIB -L$EXPAT_LIB -L$CARES_LIB -L$LIBSSH2_LIB"
          LDFLAGS="--sysroot=$SYSROOT -pie -Wl,-rpath='\$\$ORIGIN/lib:./lib' $DEPS_LDFLAGS"
          if [ "$LINK_CXX_STATIC" = "true" ]; then
            LDFLAGS="$LDFLAGS -static-libstdc++"
          fi
          ./configure \
            --host=aarch64-linux-android \
            --build="$(dpkg-architecture -qDEB_BUILD_GNU_TYPE)" \
            --disable-nls --without-gnutls --with-openssl \
            --without-sqlite3 --without-libxml2 \
            --with-libexpat --with-libcares --with-libz --with-libssh2 \
            --with-libssh2-includes="$LIBSSH2_INC" \
            --with-libssh2-libs="$LIBSSH2_LIB" \
            --disable-static --enable-shared \
            AR="$AR" AS="$AS" CC="$CC" CXX="$CXX" LD="$LD" \
            RANLIB="$RANLIB" STRIP="$STRIP" \
            CXXFLAGS="-Os -g --sysroot=$SYSROOT" \
            CFLAGS="-Os -g --sysroot=$SYSROOT" \
            CPPFLAGS="-fPIE $DEPS_CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            OPENSSL_CFLAGS="-I$OPENSSL_INC" \
            OPENSSL_LIBS="-L$OPENSSL_LIB -lssl -lcrypto" \
            LIBSSH2_CFLAGS="-I$LIBSSH2_INC" \
            LIBSSH2_LIBS="-L$LIBSSH2_LIB -lssh2" \
            PKG_CONFIG_LIBDIR="$PKG_CONFIG_LIBDIR" || {
              echo "=== configure failed ==="
              tail -n 100 config.log; exit 1
            }

      - name: Build aria2
        run: make -j$(nproc)

      - name: Prepare artifacts
        run: |
          set -e
          mkdir -p output/bin output/lib
          cp src/aria2c output/bin/
          find $HOME/deps \( -name "*.so" -o -name "*.so.*" \) -exec cp -L {} output/lib/ \; 2>/dev/null || true
          if [ "$LINK_CXX_STATIC" != "true" ]; then
            CXX_RT=$(find $SYSROOT/usr/lib/aarch64-linux-android -name "libc++_shared.so" | head -1)
            [ -f "$CXX_RT" ] && cp "$CXX_RT" output/lib/ || echo "Warning: libc++_shared.so not found"
          fi
          $STRIP output/bin/aria2c
          find output/lib -name "*.so*" -exec $STRIP {} \; 2>/dev/null || true
          echo "=== 产物自检 ==="
          strings output/lib/libcrypto.so* | grep -E 'OpenSSL [0-9]' || true
          find output -type f | sort

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-android-arm64-v8a
          path: output/
          if-no-files-found: error

      # ===== 以下仅在 schedule / workflow_dispatch 时执行 =====

      - name: Package release archive (tar.xz)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')
          ARCHIVE="aria2-android-arm64-v8a-1.37.0.tar.xz"
          tar -cf - -C output . | xz -9e -T0 -z > "$ARCHIVE"
          echo "RELEASE_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          ls -lh "$ARCHIVE"

      - name: Create GitHub Release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria2-for-android-35
          name: aria2 for android-35
          body: |
            Build time: ${{ env.BUILD_TIME }}
          files: ${{ env.RELEASE_ARCHIVE }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
